# Haalt de emissiezones bij het NDW op en zet ze om naar milieuzones.json.
#
# Let op de aanhalingstekens bij "on". In dit bestandsformaat wordt het woord
# on zonder aanhalingstekens soms gelezen als "ja" in plaats van als het
# kopje waar de startmomenten onder horen. Dan meldt GitHub: No event triggers
# defined in 'on'. Met aanhalingstekens kan dat niet gebeuren.

name: Milieuzones bijwerken

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Zonebestand ophalen bij het NDW
        run: |
          curl -fsSL https://opendata.ndw.nu/emissiezones.xml.gz -o zones.xml.gz
          gunzip -f zones.xml.gz

      - name: Omzetten naar milieuzones.json
        run: python3 .github/workflows/omzetten.py zones.xml milieuzones.json

      - name: Opruimen
        run: rm -f zones.xml

      - name: Vastleggen als er iets veranderd is
        run: |
          if git diff --quiet -- milieuzones.json; then
            echo "Geen wijzigingen in de zones."
            exit 0
          fi
          git config user.name  "milieuzone-robot"
          git config user.email "actions@github.com"
          git add milieuzones.json
          git commit -m "Milieuzones bijgewerkt vanaf NDW"
          git push
