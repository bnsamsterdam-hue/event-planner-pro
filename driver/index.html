<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bezorger Tapwagen.nl</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef7ff;color:#172033}.box{margin:24px;padding:24px;border-radius:22px;background:#fff;box-shadow:0 10px 28px rgba(15,23,42,.12)}.btn{display:block;margin-top:14px;padding:16px;border-radius:16px;background:#075fc4;color:#fff;text-decoration:none;font-weight:900;text-align:center}
</style>
<script>
(function(){
  try{
    if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(regs){ regs.forEach(function(r){try{r.unregister();}catch(e){}}); }); }
    if(window.caches && caches.keys){ caches.keys().then(function(keys){ keys.forEach(function(k){try{caches.delete(k);}catch(e){}}); }); }
  }catch(e){}
  var base = location.pathname.replace(/\/driver\/?$/i,'/');
  var target = location.origin + base + '?driver=1&v=138';
  setTimeout(function(){ location.replace(target); },150);
})();
</script>
</head>
<body>
<div class="box">
<h1>Bezorger Tapwagen.nl</h1>
<p>Mobiele omgeving wordt geopend...</p>
<a class="btn" href="../?driver=1&v=138">Open mobiele planner</a>
</div>
</body>
</html>
