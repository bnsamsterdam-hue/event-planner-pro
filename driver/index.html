<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bezorger Tapwagen.nl</title>
  <!-- DRV-R2: css en manifest hadden een VAST versienummer (686), dus die bleven
       op een telefoon oneindig uit de opgeslagen kopie komen. Nu meeliftend op
       dezelfde verse adresregel als de scripts hieronder. -->
  <script>var __v0 = Date.now();
    document.write('<link rel="manifest" href="manifest.json?v=' + __v0 + '">');
    document.write('<link rel="stylesheet" href="driver.css?v=' + __v0 + '">');
  </script>
  <noscript><link rel="stylesheet" href="driver.css"></noscript>
</head>
<body>
  <header class="top">
    <div>
      <h1>Bezorger Tapwagen.nl</h1>
      <small id="who">Mobiele opdrachten</small>
    </div>
    <button id="logoutBtn" class="ghost hidden" type="button">Uitloggen</button>
  </header>

  <main class="wrap">
    <div id="status" class="statusbar">Starten...</div>

    <section id="loginBox" class="card login-card">
      <h2>Inloggen</h2>
      <p class="help">Kies je naam en vul je PIN in.</p>
      <div class="login-grid">
        <label>Naam</label>
        <select id="loginName"></select>
        <label>PIN</label>
        <input id="loginPin" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="PIN">
        <button id="loginBtn" type="button" class="btn-full">Inloggen</button>
      </div>
    </section>

    <section id="appBox" class="hidden">
      <div class="toolbar">
        <input id="searchBox" class="search" placeholder="Zoek opdracht / klant / adres">
        <button id="refreshBtn" type="button">Verversen</button>
        <button id="clearSearchBtn" class="btn-dark" type="button">Leeg</button>
      </div>
      <section id="ordersView"><div id="orders"></div></section>
      <section id="detailView" class="hidden"></section>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script>
    /* v1-fix: zelfde reden als bij de hoofd-app - altijd de nieuwste
       versie ophalen in plaats van een vast versienummer dat handmatig
       bijgewerkt moet worden, of geen cache-busting (firebase-config.js). */
    var __v = Date.now();
    document.write('<script src="../firebase-config.js?v=' + __v + '"><\/script>');
    document.write('<script src="driver.js?v=' + __v + '"><\/script>');
  </script>
  <!-- BNS 541: pushmeldingen op bezorger/telefoon voorlopig uitgeschakeld -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){try{r.unregister()}catch(e){}});});
    }
  </script>
</body>
</html>
