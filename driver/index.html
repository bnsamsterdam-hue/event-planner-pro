<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Bezorger Tapwagen.nl</title>
  <script>
    (function(){
      try{
        if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); }
        if(window.caches){ caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); }); }
      }catch(e){}
      var base = location.pathname.replace(/\/driver\/?$/i,'/');
      var target = location.origin + base + '?driver=1&v=132&nocache=' + Date.now();
      setTimeout(function(){ location.replace(target); }, 80);
    })();
  </script>
</head>
<body style="font-family:Arial,sans-serif;background:#eef7ff;color:#172033">
  <div style="margin:24px;padding:24px;border-radius:22px;background:#fff;box-shadow:0 10px 28px rgba(15,23,42,.12);border:1px solid #dbeafe">
    <h1>Bezorger Tapwagen.nl</h1>
    <p>Mobiele opdrachten worden geopend...</p>
    <a style="display:block;margin-top:18px;background:#075fc4;color:#fff;text-decoration:none;text-align:center;border-radius:18px;padding:18px;font-weight:900;font-size:20px" href="../?driver=1&v=132">Open mobiele planner</a>
  </div>
</body>
</html>
