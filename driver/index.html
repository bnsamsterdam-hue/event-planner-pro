<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bezorger Tapwagen.nl</title>
  <link rel="manifest" href="manifest.json?v=143">
  <link rel="stylesheet" href="driver.css?v=143">
</head>
<body>
  <header class="top">
    <div>
      <h1>Bezorger Tapwagen.nl</h1>
      <small id="who">Mobiele opdrachten</small>
    </div>
    <button id="logoutBtn" class="ghost hidden" type="button">Uitloggen</button>
  </header>

  <main class="wrap">
    <div id="status" class="statusbar">Starten...</div>

    <section id="loginBox" class="card login-card">
      <h2>Inloggen</h2>
      <p class="help">Kies je naam en vul je PIN in.</p>
      <div class="login-grid">
        <label>Naam</label>
        <select id="loginName"></select>
        <label>PIN</label>
        <input id="loginPin" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="PIN">
        <button id="loginBtn" type="button" class="btn-full">Inloggen</button>
      </div>
    </section>

    <section id="appBox" class="hidden">
      <div class="toolbar">
        <input id="searchBox" class="search" placeholder="Zoek opdracht / klant / adres">
        <button id="refreshBtn" type="button">Verversen</button>
        <button id="clearSearchBtn" class="btn-dark" type="button">Leeg</button>
      </div>
      <section id="ordersView"><div id="orders"></div></section>
      <section id="detailView" class="hidden"></section>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="../firebase-config.js"></script>
  <script src="../firebase-push-config.js"></script>
  <script src="../firebase-push-client.js"></script>
  <script src="driver.js?v=143"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){try{r.unregister()}catch(e){}});});
    }
  </script>
</body>
</html>
