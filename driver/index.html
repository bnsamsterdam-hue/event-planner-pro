<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Bezorger Tapwagen.nl</title>
  <script>
    (function(){
      try {
        if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(regs){ regs.forEach(function(r){ r.unregister(); }); });
        if (window.caches && caches.keys) caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
      } catch(e) {}
      var base = location.pathname.replace(/\/driver\/?$/i,'/');
      location.replace(location.origin + base + '?oldlogin=1&v=139');
    })();
  </script>
</head>
<body>
  <p>Bezorger Tapwagen.nl wordt geopend...</p>
</body>
</html>
