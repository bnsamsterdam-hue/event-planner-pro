<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>BNS Bezorger</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef7ff;color:#172033}
    .box{margin:24px;padding:24px;border-radius:22px;background:#fff;box-shadow:0 10px 28px rgba(15,23,42,.12);border:1px solid #dbeafe}
    h1{margin:0 0 10px;font-size:32px}.muted{color:#64748b;font-weight:700;line-height:1.45}.btn{display:block;margin-top:18px;background:#075fc4;color:#fff;text-decoration:none;text-align:center;border-radius:18px;padding:18px;font-weight:900;font-size:20px}.warn{background:#fff7ed;border-color:#fed7aa}.small{font-size:14px;color:#475569}
  </style>
  <script>
    (function(){
      function openMobile(){
        var path = location.pathname;
        var isDriver = /\/driver\/?$/i.test(path);
        if(!isDriver){
          // Safety: when this file is accidentally uploaded as the root index.html,
          // do NOT redirect to itself. Show the repair warning instead.
          document.addEventListener('DOMContentLoaded', function(){
            document.body.innerHTML = '<div class="box warn"><h1>Verkeerde index.html</h1><p class="muted">Deze driver pagina staat in de hoofdmap. Zet de originele hoofdmap index.html terug en upload dit bestand alleen als <b>driver/index.html</b>.</p><a class="btn" href="./">Terug naar hoofdapp</a><p class="small">Structuur: index.html + app.js in hoofdmap, en driver/index.html in map driver.</p></div>';
          });
          return;
        }
        var base = path.replace(/\/driver\/?$/i,'/');
        var target = location.origin + base + '?telefoon=1&v=97';
        setTimeout(function(){ location.replace(target); }, 80);
      }
      openMobile();
    })();
  </script>
</head>
<body>
  <div class="box">
    <h1>BNS Bezorger</h1>
    <p class="muted">Mobiele planner wordt geopend...</p>
    <a class="btn" href="../?telefoon=1&v=97">Open mobiele planner</a>
  </div>
</body>
</html>
