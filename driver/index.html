<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="robots" content="noindex">
  <title>Bezorger Tapwagen.nl</title>
  <link rel="manifest" href="manifest.json?v=123">
  <link rel="stylesheet" href="driver.css?v=123">
</head>
<body>
  <header class="top">
    <div>
      <h1>Bezorger Tapwagen.nl</h1>
      <small id="who">Mobiele opdrachten</small>
    </div>
    <button id="logoutBtn" class="ghost hidden" type="button">Uitloggen app</button>
  </header>

  <main class="wrap">
    <div id="status" class="statusbar">Starten...</div>

    <section id="loginBox" class="card login-card">
      <h2>Inloggen</h2>
      <p class="help">Vul alleen je persoonlijke PIN in.</p>
      <div class="login-grid">
        <label>PIN</label>
        <input id="loginPin" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="PIN">
        <button id="loginBtn" type="button" class="btn-full">Inloggen</button>
      </div>
    </section>

    <section id="appBox" class="hidden">
      <div class="toolbar">
        <input id="searchBox" class="search" placeholder="Zoek opdracht / klant / adres">
        <button id="refreshBtn" type="button">Verversen</button>
        <button id="clearSearchBtn" class="btn-dark" type="button">Leeg</button>
      </div>
      <section id="ordersView"><div id="orders"></div></section>
      <section id="detailView" class="hidden"></section>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="../firebase-config.js?v=123"></script>
  <script src="../firebase-push-config.js?v=123"></script>
  <script src="../firebase-push-client.js?v=123"></script>
  <script src="driver.js?v=123"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=123').then(function(reg){ if(reg && reg.update) reg.update(); }).catch(function(){});
    }
  </script>
</body>
</html>
