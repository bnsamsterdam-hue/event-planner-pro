<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>BNS Planner</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="planner.css">
</head>

<body>
  <header class="top">
    <h1>BNS Planner</h1>
    <small id="who">Mobiele planner via Firebase</small>
  </header>

  <main class="wrap">
    <div id="status" class="statusbar">
      Starten...
    </div>

    <section id="loginBox" class="card">
      <h2>Inloggen</h2>

      <div class="login-grid">
        <label for="loginName">Naam</label>
        <select id="loginName"></select>

        <label for="loginPin">PIN</label>
        <input
          id="loginPin"
          type="password"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="PIN"
        >

        <button id="loginBtn" type="button">
          Inloggen
        </button>
      </div>
    </section>

    <section id="appBox" class="hidden">
      <div class="toolbar">
        <input
          id="searchBox"
          class="search"
          placeholder="Zoek opdracht / klant / adres / bezorger"
        >

        <button id="refreshBtn" type="button">
          Verversen
        </button>

        <button id="logoutBtn" class="btn-dark" type="button">
          Uitloggen
        </button>
      </div>

      <div id="orders"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <!-- Firebase basis -->
  <script src="../firebase-config.js"></script>
  <script src="../firebase-sync.js"></script>

  <!-- Push meldingen -->
  <script src="../firebase-push-config.js"></script>
  <script src="../firebase-push-client.js"></script>

  <!-- Planner app -->
  <script src="planner.js"></script>
</body>
</html>
